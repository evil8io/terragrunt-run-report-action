name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'release-please--branches--')
        run: git diff --quiet "origin/$GITHUB_BASE_REF" HEAD -- dist

      - id: mise
        run: echo "version=$(cat .mise-version)" >> "$GITHUB_OUTPUT"

      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: ${{ steps.mise.outputs.version }}
          install_args: node pnpm
          cache: true

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build
