name: e2e

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: e2e-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tf: [opentofu, terraform]
    defaults:
      run:
        working-directory: tests/e2e/stack
    env:
      TG_PROVIDER_CACHE: 1
      TG_NON_INTERACTIVE: 1
      TG_NO_COLOR: 1
      NO_COLOR: 1
      TG_TF_PATH: ${{ matrix.tf == 'opentofu' && 'tofu' || 'terraform' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: mise
        working-directory: .
        run: echo "version=$(cat .mise-version)" >> "$GITHUB_OUTPUT"

      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: ${{ steps.mise.outputs.version }}
          install_args: node pnpm terragrunt ${{ matrix.tf }}
          cache: true

      - name: Build the action
        working-directory: .
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Generate the stack
        run: terragrunt stack generate

      - name: Phase 1, baseline apply
        env:
          E2E_PHASE: 1
        run: terragrunt run --all -- apply -no-color

      - name: Phase 2, plan
        env:
          E2E_PHASE: 2
        continue-on-error: true
        run: |
          terragrunt run --all --json-out-dir plans-2 --report-file report-plan-2.json --report-format json \
            -- plan -no-color -compact-warnings ${{ matrix.tf == 'opentofu' && '-concise' || '' }} 2>&1 | tee plan-2.log; exit ${PIPESTATUS[0]}

      - name: Phase 2, plan report
        id: plan-2
        if: always()
        uses: ./
        with:
          header: "Plan (changes)"
          log-file: tests/e2e/stack/plan-2.log
          plan-json-dir: tests/e2e/stack/plans-2
          report-file: tests/e2e/stack/report-plan-2.json
          working-directory: tests/e2e/stack
          comment: ${{ matrix.tf == 'opentofu' && github.event.pull_request.head.repo.full_name == github.repository }}
          pr-number: ${{ github.event.pull_request.number }}

      - name: Phase 2, apply
        env:
          E2E_PHASE: 2
        continue-on-error: true
        run: |
          terragrunt run --all --report-file report-apply-2.json --report-format json \
            -- apply -no-color -compact-warnings ${{ matrix.tf == 'opentofu' && '-json-into=apply.json' || '' }} 2>&1 | tee apply-2.log; exit ${PIPESTATUS[0]}

      - name: Phase 2, apply report
        id: apply-2
        if: always()
        uses: ./
        with:
          header: "Apply (changes)"
          log-file: tests/e2e/stack/apply-2.log
          apply-json-files: ${{ matrix.tf == 'opentofu' && 'tests/e2e/stack/.terragrunt-stack/**/.terragrunt-cache/**/apply.json' || '' }}
          report-file: tests/e2e/stack/report-apply-2.json
          working-directory: tests/e2e/stack
          comment: ${{ matrix.tf == 'opentofu' && github.event.pull_request.head.repo.full_name == github.repository }}
          pr-number: ${{ github.event.pull_request.number }}

      - name: Remove the -json-into files of phase 2
        run: find .terragrunt-stack -name apply.json -path '*/.terragrunt-cache/*' -delete

      - name: Phase 3, plan
        env:
          E2E_PHASE: 3
        continue-on-error: true
        run: |
          terragrunt run --all --json-out-dir plans-3 --report-file report-plan-3.json --report-format json \
            -- plan -no-color -compact-warnings ${{ matrix.tf == 'opentofu' && '-concise' || '' }} 2>&1 | tee plan-3.log; exit ${PIPESTATUS[0]}

      - name: Phase 3, plan report
        id: plan-3
        if: always()
        uses: ./
        with:
          header: "Plan (failures)"
          log-file: tests/e2e/stack/plan-3.log
          plan-json-dir: tests/e2e/stack/plans-3
          report-file: tests/e2e/stack/report-plan-3.json
          working-directory: tests/e2e/stack
          comment: ${{ matrix.tf == 'opentofu' && github.event.pull_request.head.repo.full_name == github.repository }}
          pr-number: ${{ github.event.pull_request.number }}

      - name: Phase 3, plan with the JSON log format
        env:
          E2E_PHASE: 3
        continue-on-error: true
        run: |
          terragrunt run --all --log-format=json --json-out-dir plans-3-json --report-file report-plan-3-json.json --report-format json \
            -- plan -no-color -compact-warnings ${{ matrix.tf == 'opentofu' && '-concise' || '' }} 2>&1 | tee plan-3-json.log; exit ${PIPESTATUS[0]}

      - name: Phase 3, plan report of the JSON log format
        id: plan-3-json
        if: always()
        uses: ./
        with:
          header: "Plan (failures, JSON log)"
          log-file: tests/e2e/stack/plan-3-json.log
          plan-json-dir: tests/e2e/stack/plans-3-json
          report-file: tests/e2e/stack/report-plan-3-json.json
          working-directory: tests/e2e/stack
          comment: ${{ matrix.tf == 'opentofu' && github.event.pull_request.head.repo.full_name == github.repository }}
          pr-number: ${{ github.event.pull_request.number }}

      - name: Phase 3, apply
        env:
          E2E_PHASE: 3
        continue-on-error: true
        run: |
          terragrunt run --all --report-file report-apply-3.json --report-format json \
            -- apply -no-color -compact-warnings ${{ matrix.tf == 'opentofu' && '-json-into=apply.json' || '' }} 2>&1 | tee apply-3.log; exit ${PIPESTATUS[0]}

      - name: Phase 3, apply report
        id: apply-3
        if: always()
        uses: ./
        with:
          header: "Apply (failures)"
          log-file: tests/e2e/stack/apply-3.log
          apply-json-files: ${{ matrix.tf == 'opentofu' && 'tests/e2e/stack/.terragrunt-stack/**/.terragrunt-cache/**/apply.json' || '' }}
          report-file: tests/e2e/stack/report-apply-3.json
          working-directory: tests/e2e/stack
          comment: ${{ matrix.tf == 'opentofu' && github.event.pull_request.head.repo.full_name == github.repository }}
          pr-number: ${{ github.event.pull_request.number }}

      - name: Phase 4, destroy
        env:
          E2E_PHASE: 4
        continue-on-error: true
        run: |
          terragrunt run --all --report-file report-destroy-4.json --report-format json \
            -- destroy -no-color -compact-warnings ${{ matrix.tf == 'opentofu' && '-json-into=destroy.json' || '' }} 2>&1 | tee destroy-4.log; exit ${PIPESTATUS[0]}

      - name: Phase 4, destroy report
        id: destroy-4
        if: always()
        uses: ./
        with:
          header: "Destroy"
          log-file: tests/e2e/stack/destroy-4.log
          apply-json-files: ${{ matrix.tf == 'opentofu' && 'tests/e2e/stack/.terragrunt-stack/**/.terragrunt-cache/**/destroy.json' || '' }}
          report-file: tests/e2e/stack/report-destroy-4.json
          working-directory: tests/e2e/stack
          comment: ${{ matrix.tf == 'opentofu' && github.event.pull_request.head.repo.full_name == github.repository }}
          pr-number: ${{ github.event.pull_request.number }}

      - name: Check the outputs
        env:
          PLAN_2_FAILED: ${{ steps.plan-2.outputs.failed }}
          PLAN_2_EMPTY: ${{ steps.plan-2.outputs.empty }}
          APPLY_2_FAILED: ${{ steps.apply-2.outputs.failed }}
          APPLY_2_EMPTY: ${{ steps.apply-2.outputs.empty }}
          PLAN_3_FAILED: ${{ steps.plan-3.outputs.failed }}
          PLAN_3_EMPTY: ${{ steps.plan-3.outputs.empty }}
          APPLY_3_FAILED: ${{ steps.apply-3.outputs.failed }}
          APPLY_3_EMPTY: ${{ steps.apply-3.outputs.empty }}
          PLAN_3_JSON_FAILED: ${{ steps.plan-3-json.outputs.failed }}
          PLAN_3_JSON_EMPTY: ${{ steps.plan-3-json.outputs.empty }}
          DESTROY_4_FAILED: ${{ steps.destroy-4.outputs.failed }}
          DESTROY_4_EMPTY: ${{ steps.destroy-4.outputs.empty }}
          PLAN_2_MARKDOWN_FILE: ${{ steps.plan-2.outputs.markdown-file }}
        run: |
          test "$PLAN_2_FAILED" = false
          test "$APPLY_2_FAILED" = false
          test "$PLAN_3_FAILED" = true
          test "$APPLY_3_FAILED" = true
          test "$PLAN_3_JSON_FAILED" = true
          test "$DESTROY_4_FAILED" = false
          test "$PLAN_2_EMPTY" = false
          test "$APPLY_2_EMPTY" = false
          test "$PLAN_3_EMPTY" = false
          test "$APPLY_3_EMPTY" = false
          test "$PLAN_3_JSON_EMPTY" = false
          test "$DESTROY_4_EMPTY" = false
          test -s "$PLAN_2_MARKDOWN_FILE"
          grep -q '^## Plan (changes)$' "$PLAN_2_MARKDOWN_FILE"
