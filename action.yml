name: Terragrunt run report
description: >-
  Write one markdown report of a terragrunt run --all plan or apply to the job summary and to a pull request
  comment. The report has one table row per unit and one section per unit with changes or a failure.
author: evil8io
branding:
  icon: file-text
  color: green
inputs:
  log-file:
    description: >-
      The stdout and stderr of `terragrunt run --all`, in the default log format or with
      `--log-format=json`. The Usage examples write it with `tee`. The diff of each resource comes from
      this file.
    required: false
  plan-json-dir:
    description: >-
      The directory of the `--json-out-dir` option of `terragrunt run --all -- plan`. It has one
      `tfplan.json` file per unit.
    required: false
  plan-json-files:
    description: >-
      Glob patterns, one per line, of the files that `terragrunt run --all -- plan -json-into=plan.json`
      writes, one per unit. The patterns are relative to the workspace. The warnings of each unit of a plan
      come from this file.
    required: false
  apply-json-files:
    description: >-
      Glob patterns, one per line, of the files that `terragrunt run --all -- apply -json-into=apply.json`
      writes, one per unit. The patterns are relative to the workspace.
    required: false
  report-file:
    description: >-
      The file of the `--report-file` option of `terragrunt run --all`, written with `--report-format
      json`.
    required: false
  working-directory:
    description: >-
      The directory where `terragrunt run --all` ran. The action reads the unit name of each `-json-into`
      file from its path relative to this directory.
    required: false
    default: .
  header:
    description: The title of the report. It is also the key of the sticky comment.
    required: false
    default: Terragrunt run report
  summary:
    description: Write the report to the job summary.
    required: false
    default: "true"
  raw-log:
    description: Add the log file to the job summary in a collapsed section.
    required: false
    default: "true"
  comment:
    description: Post the report as a sticky pull request comment.
    required: false
    default: "false"
  comment-failure:
    description: >-
      What the action does when it cannot post the comment, for example on a pull request from a fork:
      `fail` fails the step, and `warn` writes a warning and continues.
    required: false
    default: fail
  repository:
    description: The `owner/name` of the repository of the pull request.
    required: false
    default: ${{ github.repository }}
  pr-number:
    description: The number of the pull request. This input is required when `comment` is `true`.
    required: false
  token:
    description: >-
      The token for the comment requests. It needs `pull-requests: write`.
    required: false
    default: ${{ github.token }}
  skip-empty:
    description: >-
      When the output `empty` is `true`, the action deletes the sticky comment and posts no comment.
    required: false
    default: "false"
  expand:
    description: Open every collapsed section of the report.
    required: false
    default: "false"
  run-url:
    description: >-
      A link to the workflow run or job that produced the report. The pull request comment ends with this
      link. Set an empty value for no link.
    required: false
    default: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
outputs:
  summary:
    description: One line with the kind of run, the unit counts, the resource totals, and, for a run with warnings, the count of the warnings and of the units with warnings.
  warnings:
    description: >-
      The number of warnings in the report, the same number as in the status line. The value is `0`
      without warnings.
  empty:
    description: >-
      The value is `true` when the run changed nothing: no unit has a change, no unit failed, and no unit
      exited early.
  failed:
    description: The value is `true` when a unit failed, a unit exited early, or the run failed.
  markdown-file:
    description: >-
      The path of a file with the report in markdown, without the log. A later step can read it, for
      example to send a message after a failed apply.
runs:
  using: node24
  main: dist/index.cjs
